<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">Where Does a Semiconductor Fab Use Water?</title>
  <desc id="desc">A bar chart comparing water use: 48% for semiconductor processes, 23% for facility support, 20% for exhaust abatement, and 9% lost in ultrapure-water treatment</desc>
  <style>
    .bg{fill:#F7F4ED}.title{font:700 25px Arial,sans-serif;fill:#10283F}
    .unit{font:20px Arial,sans-serif;fill:#6A625A}.label{font:20px Arial,sans-serif;fill:#253443}
    .value{font:700 20px Arial,sans-serif;fill:#10283F}.axis{stroke:#768594;stroke-width:1.4}
    .grid{stroke:#D9D1C5;stroke-width:1}.note{font:20px Arial,sans-serif;fill:#756C63}
  </style>
  <rect class="bg" width="100%" height="100%" rx="18"/>
  <text x="30" y="44" class="title">Where Does a Semiconductor Fab Use Water?</text>
  <text x="30" y="72" class="unit">Unit: Representative share of water use (%)</text>
  <line x1="70" y1="345" x2="855" y2="345" class="axis"/>
  <line x1="70" y1="235" x2="855" y2="235" class="grid"/>
  <line x1="70" y1="125" x2="855" y2="125" class="grid"/>
  <rect x="112" y="134" width="112" height="211" rx="7" fill="#A94E32"/>
  <text x="168" y="120" text-anchor="middle" class="value">48%</text>
  <text x="168" y="376" text-anchor="middle" class="label">Wafer process</text>
  <rect x="305" y="244" width="112" height="101" rx="7" fill="#1F5A75"/>
  <text x="361" y="230" text-anchor="middle" class="value">23%</text>
  <text x="361" y="376" text-anchor="middle" class="label">Facilities</text>
  <rect x="498" y="257" width="112" height="88" rx="7" fill="#4D7C6F"/>
  <text x="554" y="243" text-anchor="middle" class="value">20%</text>
  <text x="554" y="376" text-anchor="middle" class="label" style="font-size:18px">Exhaust abatement</text>
  <rect x="691" y="305" width="112" height="40" rx="7" fill="#C18A3D"/>
  <text x="747" y="291" text-anchor="middle" class="value">9%</text>
  <text x="747" y="376" text-anchor="middle" class="label">UPW loss</text>
  <text x="70" y="404" class="note" style="font-size:16px"><tspan x="70" dy="0">NIST 2024 representative breakdown; values rounded.</tspan><tspan x="70" dy="20">Nonindustrial use below 1% is omitted.</tspan></text>
  <rect x="790" y="28" width="100" height="28" rx="14" fill="#10283F"/>
  <text x="840" y="47" text-anchor="middle" style="font:700 17px Arial,sans-serif;fill:#F7F4ED">USE MIX</text>
</svg>
