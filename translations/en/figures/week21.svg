<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">Should You Report Yield Data That Contradict a Manager?</title>
<style>
  .bg{fill:#F7F4ED} .title{font:700 25px Arial,sans-serif;fill:#10283F}
  .label{font:700 20px Arial,sans-serif;fill:#10283F}
  .small{font:20px Arial,sans-serif;fill:#675F58}
  .big{font:700 31px Arial,sans-serif;fill:#A94E32}
  .badge{font:700 20px Arial,sans-serif;fill:#F7F4ED}
</style>
<rect class="bg" width="100%" height="100%" rx="18"/>
<text x="30" y="46" class="title">Should You Report Yield Data That Contradict a Manager?</text><desc id="desc">A time-boxed reporting process after a new employee discovers an anomalous yield</desc>
<line x1="105" y1="234" x2="815" y2="234" stroke="#7C8994" stroke-width="4"/>
<circle cx="130" cy="234" r="34" fill="#A94E32"/><circle cx="350" cy="234" r="34" fill="#1F5A75"/><circle cx="570" cy="234" r="34" fill="#4D7C6F"/><circle cx="790" cy="234" r="34" fill="#10283F"/>
<text x="130" y="155" text-anchor="middle" class="label">Anomaly found</text><text x="350" y="155" text-anchor="middle" class="label">Recheck raw data</text><text x="570" y="155" text-anchor="middle" class="label">Report in parallel</text><text x="790" y="145" text-anchor="middle" class="label"><tspan x="790" dy="0">Correction /</tspan><tspan x="790" dy="22">disclosure decision</tspan></text>
<text x="130" y="240" text-anchor="middle" class="badge">FIND</text><text x="350" y="240" text-anchor="middle" class="badge">LIMIT</text><text x="570" y="240" text-anchor="middle" class="badge">LOG</text><text x="790" y="240" text-anchor="middle" class="badge">DUTY</text>
<text x="130" y="314" text-anchor="middle" class="small">Do not conceal</text><text x="350" y="314" text-anchor="middle" class="small">No open-ended delay</text><text x="570" y="304" text-anchor="middle" class="small"><tspan x="570" dy="0">Manager + independent</tspan><tspan x="570" dy="22">channel</tspan></text><text x="790" y="314" text-anchor="middle" class="small">Preserve evidence</text>
<text x="68" y="392" class="small" style="font-size:17px"><tspan x="68" dy="0">Resolve the tension between immediate reporting and prior verification by setting both</tspan><tspan x="68" dy="22">a verification deadline and an independent reporting channel.</tspan></text>
<rect x="752" y="28" width="138" height="28" rx="14" fill="#10283F"/><text x="821" y="47" text-anchor="middle" class="badge" style="font-size:16px">REPORTING FLOW</text>
</svg>
