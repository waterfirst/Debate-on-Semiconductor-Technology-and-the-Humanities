<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">Should a Black Box Run the Process for +1%p Yield?</title>
<style>
  .bg{fill:#F7F4ED} .title{font:700 25px Arial,sans-serif;fill:#10283F}
  .label{font:700 20px Arial,sans-serif;fill:#10283F}
  .small{font:20px Arial,sans-serif;fill:#675F58}
  .big{font:700 31px Arial,sans-serif;fill:#A94E32}
  .badge{font:700 20px Arial,sans-serif;fill:#F7F4ED}
</style>
<rect class="bg" width="100%" height="100%" rx="18"/>
<text x="30" y="46" class="title">Should a Black Box Run the Process for +1%p Yield?</text><desc id="desc">Diagram linking governance to the three operational functions in the NIST AI Risk Management Framework</desc>
<circle cx="460" cy="245" r="78" fill="#10283F"/><text x="460" y="251" text-anchor="middle" class="badge" style="font-size:20px">GOVERN</text>
<circle cx="215" cy="245" r="66" fill="#FCFAF5" stroke="#A94E32" stroke-width="3"/><text x="215" y="239" text-anchor="middle" class="label">Map context</text><text x="215" y="267" text-anchor="middle" class="small">MAP</text>
<circle cx="705" cy="165" r="66" fill="#FCFAF5" stroke="#1F5A75" stroke-width="3"/><text x="705" y="159" text-anchor="middle" class="label">Measure risk</text><text x="705" y="187" text-anchor="middle" class="small">MEASURE</text>
<circle cx="705" cy="325" r="66" fill="#FCFAF5" stroke="#4D7C6F" stroke-width="3"/><text x="705" y="319" text-anchor="middle" class="label">Manage risk</text><text x="705" y="347" text-anchor="middle" class="small">MANAGE</text>
<path d="M284 245H374M535 221L639 184M535 269L639 306" stroke="#7C8994" stroke-width="3"/>
<text x="38" y="410" class="small">Judge black-box control by observation, stopping, and accountability—not accuracy alone.</text>
<rect x="752" y="28" width="138" height="28" rx="14" fill="#10283F"/><text x="821" y="47" text-anchor="middle" class="badge">AI RMF</text>
</svg>
