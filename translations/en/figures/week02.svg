<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">U.S.–China Export Controls and the Nationality of Technology</title>
<style>
  .bg{fill:#F7F4ED} .title{font:700 25px Arial,sans-serif;fill:#10283F}
  .unit{font:20px Arial,sans-serif;fill:#6A625A} .label{font:20px Arial,sans-serif;fill:#253443}
  .value{font:700 20px Arial,sans-serif;fill:#10283F} .grid{stroke:#D9D1C5;stroke-width:1}
  .axis{stroke:#768594;stroke-width:1.4} .note{font:20px Arial,sans-serif;fill:#756C63}
</style>
<rect class="bg" width="100%" height="100%" rx="18"/>
<text x="30" y="44" class="title">U.S.–China Export Controls and the Nationality of Technology</text>
<text x="30" y="72" class="unit">Unit: China’s share of ASML system sales (%)</text><desc id="desc">Bars showing China’s share of ASML system sales alongside a timeline of major export-control measures</desc>
<text x="52" y="112" class="label" style="font-weight:700;font-size:18px">China share of ASML system sales</text>
<rect x="73" y="225" width="118" height="116" rx="8" fill="#1F5A75"/>
<text x="132" y="208" text-anchor="middle" class="value" style="font-size:27px">29%</text>
<text x="132" y="370" text-anchor="middle" class="label">2023</text>
<rect x="240" y="177" width="118" height="164" rx="8" fill="#A94E32"/>
<text x="299" y="160" text-anchor="middle" class="value" style="font-size:27px">41%</text>
<text x="299" y="370" text-anchor="middle" class="label">2024</text>
<text x="54" y="420" class="note" style="font-size:17px">Customer fab location · not equivalent to EUV access</text>
<line x1="443" y1="136" x2="443" y2="345" stroke="#D9D1C5" stroke-width="2"/>
<text x="485" y="112" class="label" style="font-weight:700">How controls expanded</text>
<circle cx="488" cy="161" r="8" fill="#1F5A75"/><text x="512" y="166" class="value">2022.10</text>
<text x="617" y="166" class="label" style="font-size:16px"><tspan x="617" y="158">U.S. controls on advanced chips</tspan><tspan x="617" dy="18">and fab equipment</tspan></text>
<circle cx="488" cy="231" r="8" fill="#4D7C6F"/><text x="512" y="236" class="value">2024.09</text>
<text x="617" y="236" class="label" style="font-size:16px"><tspan x="617" y="228">Dutch licensing expanded for</tspan><tspan x="617" dy="18">selected DUV equipment</tspan></text>
<circle cx="488" cy="301" r="8" fill="#A94E32"/><text x="512" y="306" class="value">2024.12</text>
<text x="617" y="306" class="label" style="font-size:16px"><tspan x="617" y="298">U.S.: 24 tool types, 3 software</tspan><tspan x="617" dy="18">tool types, and HBM</tspan></text>
<text x="485" y="365" class="note" style="font-size:17px">A higher share alone does not mean controls failed</text>
<text x="485" y="393" class="note" style="font-size:17px">Check DUV demand and shipment lags together</text>
<rect x="770" y="24" width="120" height="36" rx="18" fill="#10283F"/><text x="830" y="49" text-anchor="middle" style="font:700 15px Arial,sans-serif;fill:#F7F4ED">Control timeline</text>
</svg>
