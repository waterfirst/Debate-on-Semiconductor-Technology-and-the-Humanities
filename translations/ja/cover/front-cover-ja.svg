<svg xmlns="http://www.w3.org/2000/svg" width="1748" height="2480" viewBox="0 0 1748 2480">
  <title>半導体面接――王の問いに答えよ　日本語版</title>
  <defs>
    <linearGradient id="paperLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6e9" stop-opacity="0.24"/>
      <stop offset="0.42" stop-color="#f5f0e3" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#e9edf0" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="softLift" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#fffdf5" flood-opacity="0.60"/>
    </filter>
  </defs>

  <rect width="1748" height="2480" fill="#f5f0e3"/>
  <image href="cover-art-gat-wafer-day-v4.png" x="0" y="0" width="1748" height="2480"
         preserveAspectRatio="xMidYMid slice"/>
  <rect width="1748" height="2480" fill="url(#paperLight)"/>
  <rect x="20" y="20" width="1708" height="2440" fill="none" stroke="#7890a0" stroke-opacity="0.30" stroke-width="2"/>

  <g fill="#071b2d" text-anchor="middle" filter="url(#softLift)">
    <text x="874" y="220" font-family="Yu Gothic, Noto Sans JP, sans-serif" font-weight="700" font-size="112" letter-spacing="9">半導体面接</text>
    <text x="874" y="438" font-family="Yu Gothic, Noto Sans JP, sans-serif" font-weight="700" font-size="158" letter-spacing="4">王の問いに</text>
    <text x="874" y="665" font-family="Yu Gothic, Noto Sans JP, sans-serif" font-weight="700" font-size="170" letter-spacing="16">答えよ</text>
  </g>

  <g fill="#203a4c" font-family="Yu Gothic, Noto Sans JP, sans-serif" font-weight="700" text-anchor="middle">
    <text x="874" y="808" font-size="47" letter-spacing="2">朝鮮王朝の策問で鍛える</text>
    <text x="874" y="880" font-size="38">AI・製造工程・設計・サプライチェーンのデータ討論</text>
  </g>
  <rect x="764" y="940" width="220" height="7" rx="3.5" fill="#a94e32" opacity="0.90"/>

  <rect x="70" y="2250" width="600" height="165" rx="14" fill="#f7f2e6" fill-opacity="0.84"/>
  <g fill="#10283f" font-family="Yu Gothic, Noto Sans JP, sans-serif" text-anchor="start">
    <text x="110" y="2320" font-size="43" font-weight="700" letter-spacing="2">チェ・ナクチョ 著</text>
    <text x="110" y="2375" font-size="24" font-weight="700" letter-spacing="4">SCHOLAR BRIDGE</text>
  </g>
</svg>
