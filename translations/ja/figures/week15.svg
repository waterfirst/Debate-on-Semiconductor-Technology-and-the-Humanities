<text x="30" y="44" class="title">一件のガス警報でラインを止めるべきか</text>
<text x="30" y="72" class="unit">単位：年間人数（百万人、対数軸推奨）</text><desc id="desc">差を強調したロリポップチャート</desc><text x="32" y="135" class="label">業務関連死亡</text><line x1="275" y1="130" x2="279.0" y2="130" stroke="#A94E32" stroke-width="5" stroke-linecap="round"/><circle cx="279.0" cy="130" r="11" fill="#A94E32"/><text x="301.0" y="136" class="value">2.93</text><text x="32" y="205" class="label">非致死性負傷</text><line x1="275" y1="200" x2="820.0" y2="200" stroke="#1F5A75" stroke-width="5" stroke-linecap="round"/><circle cx="820.0" cy="200" r="11" fill="#1F5A75"/><text x="842.0" y="206" class="value">395</text><text x="32" y="410" class="note">最大値は最小値の134.8倍・差の原因と基準を検討</text>
<rect x="792" y="28" width="98" height="28" rx="14" fill="#10283F"/><text x="841" y="47" text-anchor="middle" style="font:700 20px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#F7F4ED">差の比較</text>
