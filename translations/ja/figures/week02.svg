<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">米中輸出規制と技術の国籍</title>
<style>
  .bg{fill:#F7F4ED} .title{font:700 25px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F}
  .unit{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#6A625A} .label{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#253443}
  .value{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F} .grid{stroke:#D9D1C5;stroke-width:1}
  .axis{stroke:#768594;stroke-width:1.4} .note{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#756C63}
</style>
<rect class="bg" width="100%" height="100%" rx="18"/>
<text x="30" y="44" class="title">米中輸出規制と技術の国籍</text>
<text x="30" y="72" class="unit">単位：ASMLシステム売上高に占める中国向け比率（%）</text><desc id="desc">ASMLシステム売上高に占める中国向け比率と、主な輸出規制の日程を示す棒グラフと年表</desc>
<text x="52" y="112" class="label" style="font-weight:700;font-size:18px">ASMLシステム売上高の中国向け比率</text>
<rect x="73" y="225" width="118" height="116" rx="8" fill="#1F5A75"/>
<text x="132" y="208" text-anchor="middle" class="value" style="font-size:27px">29%</text>
<text x="132" y="370" text-anchor="middle" class="label">2023</text>
<rect x="240" y="177" width="118" height="164" rx="8" fill="#A94E32"/>
<text x="299" y="160" text-anchor="middle" class="value" style="font-size:27px">41%</text>
<text x="299" y="370" text-anchor="middle" class="label">2024</text>
<text x="54" y="420" class="note" style="font-size:17px">顧客工場の所在地基準・EUV確保とは異なります</text>
<line x1="443" y1="136" x2="443" y2="345" stroke="#D9D1C5" stroke-width="2"/>
<text x="485" y="112" class="label" style="font-weight:700">規制範囲の拡大過程</text>
<circle cx="488" cy="161" r="8" fill="#1F5A75"/><text x="512" y="166" class="value">2022.10</text>
<text x="617" y="166" class="label" style="font-size:17px">米国：先端チップ・製造装置規制</text>
<circle cx="488" cy="231" r="8" fill="#4D7C6F"/><text x="512" y="236" class="value">2024.09</text>
<text x="617" y="236" class="label" style="font-size:16px">オランダ：一部DUVの許可拡大</text>
<circle cx="488" cy="301" r="8" fill="#A94E32"/><text x="512" y="306" class="value">2024.12</text>
<text x="617" y="306" class="label" style="font-size:17px">米国：装置24種・SW 3種・HBM</text>
<text x="485" y="365" class="note" style="font-size:17px">比率上昇だけで規制失敗とは判断できません</text>
<text x="485" y="393" class="note" style="font-size:17px">DUV需要と出荷の時間差も確認します</text>
<rect x="770" y="24" width="120" height="36" rx="18" fill="#10283F"/><text x="830" y="49" text-anchor="middle" style="font:700 18px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#F7F4ED">規制年表</text>
</svg>
