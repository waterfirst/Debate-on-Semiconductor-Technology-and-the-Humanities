<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">上司の結論と異なる歩留まりデータを報告すべきか</title>
<style>
  .bg{fill:#F7F4ED} .title{font:700 25px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F}
  .label{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F}
  .small{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#675F58}
  .big{font:700 31px "Yu Gothic","Noto Sans JP",sans-serif;fill:#A94E32}
  .badge{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#F7F4ED}
</style>
<rect class="bg" width="100%" height="100%" rx="18"/>
<text x="30" y="46" class="title">上司の結論と異なる歩留まりデータを報告すべきか</text><desc id="desc">新入社員が異常な歩留まりを発見した後、期限を設けて報告する手順</desc>
<line x1="105" y1="234" x2="815" y2="234" stroke="#7C8994" stroke-width="4"/>
<circle cx="130" cy="234" r="34" fill="#A94E32"/><circle cx="350" cy="234" r="34" fill="#1F5A75"/><circle cx="570" cy="234" r="34" fill="#4D7C6F"/><circle cx="790" cy="234" r="34" fill="#10283F"/>
<text x="130" y="155" text-anchor="middle" class="label">異常を発見</text><text x="350" y="155" text-anchor="middle" class="label">原データを再検証</text><text x="570" y="155" text-anchor="middle" class="label">同時報告</text><text x="790" y="155" text-anchor="middle" class="label">修正・開示判断</text>
<text x="130" y="240" text-anchor="middle" class="badge">発見</text><text x="350" y="240" text-anchor="middle" class="badge">期限</text><text x="570" y="240" text-anchor="middle" class="badge">記録</text><text x="790" y="240" text-anchor="middle" class="badge">責任</text>
<text x="130" y="314" text-anchor="middle" class="small">隠さない</text><text x="350" y="314" text-anchor="middle" class="small">無期限に遅らせない</text><text x="570" y="314" text-anchor="middle" class="small">上司・独立窓口</text><text x="790" y="314" text-anchor="middle" class="small">根拠を保存</text>
<text x="68" y="402" class="small" style="font-size:17px">即時報告と先行検証の対立は、「検証期限」と「独立報告ルート」を併設して解決します。</text>
<rect x="752" y="28" width="138" height="28" rx="14" fill="#10283F"/><text x="821" y="47" text-anchor="middle" class="badge" style="font-size:16px">報告タイムライン</text>
</svg>
