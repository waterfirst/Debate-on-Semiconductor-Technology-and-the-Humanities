<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">費用が25%増えてもファブデータを国内に置くべきか</title>
<style>
  .bg{fill:#F7F4ED} .title{font:700 25px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F}
  .unit{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#6A625A} .label{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#253443}
  .value{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F} .grid{stroke:#D9D1C5;stroke-width:1}
  .axis{stroke:#768594;stroke-width:1.4} .note{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#756C63}
</style>
<rect class="bg" width="100%" height="100%" rx="18"/>
<text x="30" y="44" class="title">費用が25%増えてもファブデータを国内に置くべきか</text>
<text x="30" y="72" class="unit">単位：上位5社のデジタル多国籍企業の売上シェア（%）</text><desc id="desc">時間とシナリオによる変化を示すトレンド線</desc><line x1="82" y1="118.0" x2="842" y2="118.0" class="grid"/><line x1="82" y1="174.2" x2="842" y2="174.2" class="grid"/><line x1="82" y1="230.5" x2="842" y2="230.5" class="grid"/><line x1="82" y1="286.8" x2="842" y2="286.8" class="grid"/><line x1="82" y1="343.0" x2="842" y2="343.0" class="grid"/><polyline points="82.0,244.6 842.0,118.0" fill="none" stroke="#1F5A75" stroke-width="5" stroke-linejoin="round"/><circle cx="82.0" cy="244.6" r="7" fill="#A94E32" stroke="#F7F4ED" stroke-width="3"/><circle cx="842.0" cy="118.0" r="7" fill="#A94E32" stroke="#F7F4ED" stroke-width="3"/><text x="82.0" y="375" text-anchor="middle" class="label">2017</text><text x="82.0" y="229.6" text-anchor="middle" class="value">21</text><text x="842.0" y="375" text-anchor="middle" class="label">2025</text><text x="842.0" y="104.0" text-anchor="middle" class="value">48</text><text x="82" y="410" class="note">最初の値から最後の値への変化：+128.6%</text>
<rect x="792" y="28" width="98" height="28" rx="14" fill="#10283F"/><text x="841" y="47" text-anchor="middle" style="font:700 18px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#F7F4ED">トレンド</text>
