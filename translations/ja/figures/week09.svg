<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">標本を減らすと無故障観測の上限が広がる</title>
  <desc id="desc">観測不良が0個のとき、標本77個、154個、231個について、真の不良確率の90パーセント片側上限を比較します。</desc>
  <style>
    .bg{fill:#F7F4ED}.title{font:700 25px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F}.sub{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#6A625A}.label{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#253443}.value{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F}.tick{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#756C63}.note{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#6A625A}.grid{stroke:#D9D1C5;stroke-width:1}.axis{stroke:#768594;stroke-width:1.4}.bar1{stroke:#A94E32;stroke-width:13;stroke-linecap:round}.bar2{stroke:#C18A3D;stroke-width:13;stroke-linecap:round}.bar3{stroke:#4D7C6F;stroke-width:13;stroke-linecap:round}.dot1{fill:#A94E32}.dot2{fill:#C18A3D}.dot3{fill:#4D7C6F}
  </style>
  <rect class="bg" width="920" height="440" rx="18"/>
  <text x="30" y="42" class="title">標本を減らすと「0件」の上限が広がります</text>
  <text x="30" y="68" class="sub">観測不良0個・真の不良確率の90%片側正確上限</text>
  <line x1="240" y1="104" x2="240" y2="338" class="axis"/>
  <line x1="440" y1="104" x2="440" y2="338" class="grid"/>
  <line x1="640" y1="104" x2="640" y2="338" class="grid"/>
  <line x1="840" y1="104" x2="840" y2="338" class="grid"/>
  <text x="240" y="92" text-anchor="middle" class="tick">0%</text>
  <text x="440" y="92" text-anchor="middle" class="tick">1%</text>
  <text x="640" y="92" text-anchor="middle" class="tick">2%</text>
  <text x="840" y="92" text-anchor="middle" class="tick">3%</text>
  <text x="54" y="155" class="label">標本77個</text>
  <line x1="240" y1="150" x2="830" y2="150" class="bar1"/>
  <circle cx="830" cy="150" r="9" class="dot1"/>
  <text x="864" y="132" text-anchor="end" class="value">2.95%</text>
  <text x="54" y="230" class="label">標本154個</text>
  <line x1="240" y1="225" x2="536" y2="225" class="bar2"/>
  <circle cx="536" cy="225" r="9" class="dot2"/>
  <text x="864" y="231" text-anchor="end" class="value">1.48%</text>
  <text x="54" y="305" class="label">標本231個</text>
  <line x1="240" y1="300" x2="438" y2="300" class="bar3"/>
  <circle cx="438" cy="300" r="9" class="dot3"/>
  <text x="864" y="306" text-anchor="end" class="value">0.99%</text>
  <rect x="30" y="355" width="860" height="60" rx="12" fill="#E9E3D9"/>
  <text x="460" y="380" text-anchor="middle" class="note" style="font-size:16px">計算：1 − 0.1^(1/n)・標本数基準：AEC-Q100 Rev J・原理：NIST正確二項区間</text>
  <text x="460" y="401" text-anchor="middle" class="note" style="font-size:17px">154個・77個は規格の削減案ではなく、情報損失を示す比較値です</text>
</svg>
