<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">AI好況の利益と配分項目は合算できない</title>
  <desc id="desc">2024年と2025年の年間営業利益、2026年第2四半期の暫定営業利益を分け、配当、自己株式消却、龍仁ファブ投資、共同用水インフラを会計上の性格別に分類した図</desc>
  <defs>
    <pattern id="sharePattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F7F4ED"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B8A999" stroke-width="2"/>
    </pattern>
    <pattern id="infraPattern" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#F7F4ED"/>
      <circle cx="4.5" cy="4.5" r="1.15" fill="#8B948F"/>
    </pattern>
    <style>
      .bg{fill:#F7F4ED}.panel{fill:#FCFAF5;stroke:#D8D0C5;stroke-width:1.2}
      .title{font:700 24px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F}.subtitle{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#6A625A}
      .panel-title{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#253443}.label{font:600 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#3E4A55}
      .value{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F}.unit{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#756C63}
      .card-title{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#253443}.card-value{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#10283F}
      .card-note{font:20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#625B54}.warning{font:700 20px "Yu Gothic","Noto Sans JP",sans-serif;fill:#F7F4ED}
    </style>
  </defs>

  <rect class="bg" width="920" height="440" rx="18"/>
  <text id="title-text" x="28" y="38" class="title">利益・現金・株式・投資計画は同じ数字ではありません</text>
  <text x="28" y="62" class="subtitle" style="font-size:18px">会社発表・政府計画｜単位・期間・会計上の性格を分離</text>

  <rect x="28" y="82" width="536" height="150" rx="13" class="panel"/>
  <text x="47" y="107" class="panel-title">年間連結営業利益</text>
  <text x="47" y="130" class="unit">会計上の成果・現金残高ではありません</text>
  <text x="47" y="158" class="label">2024</text>
  <rect x="104" y="144" width="195" height="20" rx="4" fill="#C9C2B8" stroke="#6F6A64" stroke-width="1"/>
  <text x="311" y="159" class="value">23.4673</text>
  <text x="47" y="198" class="label">2025</text>
  <rect x="104" y="184" width="392" height="20" rx="4" fill="#2D6278"/>
  <text x="480" y="199" text-anchor="end" class="value" style="fill:#F7F4ED">47.2063</text>

  <rect x="576" y="82" width="316" height="150" rx="13" fill="#FCFAF5" stroke="#8C5A3C" stroke-width="1.8"/>
  <rect x="603" y="96" width="142" height="28" rx="14" fill="#8C5A3C"/>
  <text x="674" y="116" text-anchor="middle" style="font:700 20px 'Yu Gothic','Noto Sans JP',sans-serif;fill:#F7F4ED">2Q26暫定</text>
  <text x="734" y="160" text-anchor="middle" class="value" style="font-size:27px">60.5426兆ウォン</text>
  <text x="734" y="198" text-anchor="middle" class="label">営業利益率76%</text>
  <text x="734" y="222" text-anchor="middle" class="unit">年間実績とは合算しません</text>

  <rect x="28" y="246" width="205" height="133" rx="12" class="panel"/>
  <rect x="28" y="246" width="205" height="8" rx="4" fill="#2D6278"/>
  <text x="45" y="278" class="card-title">現金配当</text>
  <text x="45" y="307" class="card-value">2.1兆ウォン</text>
  <text x="45" y="342" class="card-note">FY25・現金</text>

  <rect x="247" y="246" width="205" height="133" rx="12" fill="url(#sharePattern)" stroke="#B8A999" stroke-width="1.2"/>
  <rect x="247" y="246" width="205" height="8" rx="4" fill="#8C5A3C"/>
  <text x="264" y="278" class="card-title">自己株式消却</text>
  <text x="264" y="307" class="card-value">1,530万株</text>
  <text x="264" y="342" class="card-note">2.1%・非現金</text>

  <rect x="466" y="246" width="205" height="133" rx="12" class="panel"/>
  <rect x="466" y="246" width="205" height="8" rx="4" fill="#537569"/>
  <text x="483" y="278" class="card-title" style="font-size:17px">龍仁第1ファブ追加投資</text>
  <text x="483" y="307" class="card-value">21.6兆ウォン</text>
  <text x="483" y="342" class="card-note">2030年までの計画</text>

  <rect x="685" y="246" width="207" height="133" rx="12" fill="url(#infraPattern)" stroke="#9CA6A0" stroke-width="1.2"/>
  <rect x="685" y="246" width="207" height="8" rx="4" fill="#6E7773"/>
  <text x="702" y="278" class="card-title" style="font-size:18px">共同用水インフラ</text>
  <text x="702" y="307" class="card-value">約2.2兆ウォン</text>
  <text x="702" y="342" class="card-note">2034年までの計画</text>

  <rect x="176" y="395" width="568" height="29" rx="14.5" fill="#10283F"/>
  <text x="460" y="414.5" text-anchor="middle" class="warning" style="font-size:18px">期間・単位・会計上の性格が異なるため合算しません</text>
</svg>
