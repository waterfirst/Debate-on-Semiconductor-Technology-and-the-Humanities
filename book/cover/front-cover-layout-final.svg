<svg xmlns="http://www.w3.org/2000/svg" width="1748" height="2480" viewBox="0 0 1748 2480">
  <defs>
    <linearGradient id="paperLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6e9" stop-opacity="0.18"/>
      <stop offset="0.40" stop-color="#f5f0e3" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#e9edf0" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="softLift" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#fffdf5" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1748" height="2480" fill="#f5f0e3"/>
  <image href="cover-art-gat-wafer-day-v4.png" x="0" y="0" width="1748" height="2480"
         preserveAspectRatio="xMidYMid slice"/>
  <rect width="1748" height="2480" fill="url(#paperLight)"/>
  <rect x="20" y="20" width="1708" height="2440" fill="none" stroke="#7890a0" stroke-opacity="0.30" stroke-width="2"/>

  <g fill="#071b2d" text-anchor="middle" filter="url(#softLift)">
    <text x="874" y="205" font-family="KoPub Dotum" font-weight="700" font-size="80" letter-spacing="13">반도체 면접,</text>
    <text x="874" y="438" font-family="KoPub Batang" font-weight="700" font-size="164" letter-spacing="-5">왕의 질문에</text>
    <text x="874" y="665" font-family="KoPub Dotum" font-weight="700" font-size="165" letter-spacing="9">답하라</text>
  </g>

  <g fill="#203a4c" font-family="KoPub Dotum" font-weight="700" text-anchor="middle">
    <text x="874" y="808" font-size="46" letter-spacing="1">조선의 책문으로 훈련하는</text>
    <text x="874" y="878" font-size="43" letter-spacing="0.5">AI · 전쟁 · 환율 · 공급망 데이터 토론 30</text>
  </g>
  <rect x="764" y="936" width="220" height="7" rx="3.5" fill="#a94e32" opacity="0.90"/>
</svg>
