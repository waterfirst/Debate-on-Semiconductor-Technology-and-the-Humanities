<svg xmlns="http://www.w3.org/2000/svg" width="3697" height="2550" viewBox="0 0 3697 2550">
  <!-- A5 148 x 210 mm, 3 mm outer bleed, provisional 11.1 mm spine for 222 pages. -->
  <rect width="3697" height="2550" fill="#071423"/>

  <!-- Back cover, including outer bleed. -->
  <image href="back-cover-gat-wafer-v2.png" x="0" y="0" width="1783" height="2550" preserveAspectRatio="xMidYMid slice"/>

  <!-- 11.1 mm spine. -->
  <rect x="1783" y="0" width="131" height="2550" fill="#081727"/>
  <path d="M1783 0V2550M1914 0V2550" stroke="#8eacc3" stroke-opacity="0.34" stroke-width="2"/>
  <text x="0" y="0" transform="translate(1880 182) rotate(90)" fill="#f3f0e7"
        font-family="KoPub Batang" font-weight="700" font-size="39" letter-spacing="1">반도체 면접, 왕의 질문에 답하라</text>
