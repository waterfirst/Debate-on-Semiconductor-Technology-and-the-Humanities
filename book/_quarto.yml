project:
  type: book
  output-dir: _book

lang: ko-KR
title: "반도체 면접, 왕의 질문에 답하라"
subtitle: "조선의 책문으로 훈련하는 AI·공정·설계·공급망 데이터 토론"
author: "최낙초"
publisher: "스칼라브릿지"
rights: "© 2026 최낙초. All rights reserved."
date: "2026-08-30"
identifier: "urn:uuid:1929a370-0363-43dc-8750-b7f44f8bdc2c"
description: "조선의 책문 형식을 현대 반도체 산업의 19개 딜레마에 적용해 데이터, 대립 답안, 90초 발언과 꼬리 질문으로 판단력을 훈련하는 독립 토론서"
keywords:
  - 반도체
  - 취업·면접
  - 기술과 인문학
  - 데이터 토론

book:
  cover-image: cover/front-cover-final.png
  title: "반도체 면접, 왕의 질문에 답하라"
  subtitle: "조선의 책문으로 훈련하는 AI·공정·설계·공급망 데이터 토론"
  author: "최낙초"
  page-navigation: true
  search: true
  chapters:
    - index.qmd
    - copyright.qmd
    - part: "산업을 움직이는 힘"
      chapters:
        - chapters/week07.qmd
        - chapters/week01.qmd
        - chapters/week05.qmd
        - chapters/week02.qmd
        - chapters/week04.qmd
    - part: "연구·설계·공정의 판단"
      chapters:
        - chapters/week09.qmd
        - chapters/week08.qmd
        - chapters/week10.qmd
        - chapters/week15.qmd
        - chapters/week11.qmd
        - chapters/week12.qmd
        - chapters/week13.qmd
    - part: "조직·보안·인재"
      chapters:
        - chapters/week18.qmd
        - chapters/week14.qmd
        - chapters/week21.qmd
        - chapters/week28.qmd
    - part: "인프라와 지속가능성"
      chapters:
        - chapters/week19.qmd
        - chapters/week26.qmd
        - chapters/week30.qmd
    - epilogue.qmd
    - interview-checklist.qmd
    - author.qmd

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    smooth-scroll: true
  epub:
    css: styles-epub.css
    html-math-method: plain
    toc: true
    toc-depth: 1
    number-sections: true
  epub2:
    css: styles-epub2.css
    html-math-method: plain
    toc: true
    toc-depth: 1
    number-sections: true
  pdf:
    documentclass: scrbook
    pdf-engine: xelatex
    papersize: a5
    fontsize: 10.5pt
    linestretch: 1.3475
    include-in-header:
      - print-style.tex
    geometry:
      - inner=20mm
      - outer=15mm
      - top=18mm
      - bottom=20mm
    toc: true
    toc-depth: 1
    number-sections: true
    colorlinks: false

filters:
  - keep-sentence-ends.lua
  - book-question.lua
  - table-widths.lua
  - hanja-font.lua

execute:
  freeze: auto
