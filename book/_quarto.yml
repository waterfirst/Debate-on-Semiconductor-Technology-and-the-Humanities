  title: "반도체 면접, 왕의 질문에 답하라"
  subtitle: "조선의 책문으로 훈련하는 AI·전쟁·환율·공급망 데이터 토론 30"
  author: "최낙초"
  page-navigation: true
  search: true
  chapters:
    - index.qmd
    - copyright.qmd
    - part: "1부 전쟁과 공급망"
      chapters:
        - chapters/week01.qmd
        - chapters/week02.qmd
        - chapters/week03.qmd
        - chapters/week04.qmd
        - chapters/week05.qmd
        - chapters/week06.qmd
    - part: "2부 경제와 시장"
      chapters:
        - chapters/week07.qmd
        - chapters/week08.qmd
        - chapters/week09.qmd
        - chapters/week10.qmd
        - chapters/week11.qmd
        - chapters/week12.qmd
    - part: "3부 기술과 윤리"
      chapters:
        - chapters/week13.qmd
        - chapters/week14.qmd
        - chapters/week15.qmd
        - chapters/week16.qmd
        - chapters/week17.qmd
        - chapters/week18.qmd
    - part: "4부 노동과 사회"
      chapters:
        - chapters/week19.qmd
        - chapters/week20.qmd
        - chapters/week21.qmd
        - chapters/week22.qmd
        - chapters/week23.qmd
        - chapters/week24.qmd
    - part: "5부 문명과 미래"
