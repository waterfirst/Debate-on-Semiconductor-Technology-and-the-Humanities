        - chapters/week25.qmd
        - chapters/week26.qmd
        - chapters/week27.qmd
        - chapters/week28.qmd
        - chapters/week29.qmd
    - chapters/week30.qmd
    - epilogue.qmd
    - interview-checklist.qmd
    - author.qmd

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    smooth-scroll: true
  epub:
    toc: true
    number-sections: true
  pdf:
    documentclass: scrbook
    pdf-engine: xelatex
    papersize: a5
    mainfont: "Pretendard-Regular.otf"
    mainfontoptions:
      - "Path=C:/Users/soonb/AppData/Local/Microsoft/Windows/Fonts/"
      - "BoldFont=Pretendard-SemiBold.otf"
    sansfont: "Pretendard-Regular.otf"
    sansfontoptions:
      - "Path=C:/Users/soonb/AppData/Local/Microsoft/Windows/Fonts/"
      - "BoldFont=Pretendard-SemiBold.otf"
    fontsize: 10.5pt
    linestretch: 1.32
    include-in-header:
      - print-style.tex
    geometry:
      - inner=20mm
      - outer=15mm
      - top=18mm
      - bottom=20mm
    toc: true
    number-sections: true
    colorlinks: false

filters:
  - book-question.lua

execute:
  freeze: auto
