<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
<title id="title">공정 AI의 블랙박스를 믿을 수 있는가 판단 매트릭스</title><desc id="desc">문제, 사람, 지표, 수정 조건을 중앙 대칭으로 배열한 표</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7C8994"/></marker></defs>
<style>.bg{fill:#F7F4ED}.title{font:700 25px "Noto Sans KR",sans-serif;fill:#10283F}.label{font:700 18px "Noto Sans KR",sans-serif;fill:#10283F}.note{font:14px "Noto Sans KR",sans-serif;fill:#675F58}.num{font:700 15px "Noto Sans KR",sans-serif;fill:#FFF}.badge{font:700 12px "Noto Sans KR",sans-serif;fill:#F7F4ED}</style>
<rect class="bg" width="100%" height="100%" rx="18"/><text x="30" y="46" class="title">공정 AI의 블랙박스를 믿을 수 있는가</text>
<rect x="772" y="28" width="118" height="28" rx="14" fill="#10283F"/><text x="831" y="47" text-anchor="middle" class="badge">판단 매트릭스</text>
<path d="M400 174H510M235 230V268M685 230V268M400 334H510" fill="none" stroke="#7C8994" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="118" width="330" height="112" rx="14" fill="#FCFAF5" stroke="#A94E32" stroke-width="2"/><circle cx="102" cy="152" r="17" fill="#A94E32"/><text x="102" y="158" text-anchor="middle" class="num">1</text><text x="132" y="156" class="label">문제 정의</text><text x="98" y="198" class="note">어떤 결정을 내려야 하는가</text><rect x="520" y="118" width="330" height="112" rx="14" fill="#FCFAF5" stroke="#1F5A75" stroke-width="2"/><circle cx="552" cy="152" r="17" fill="#1F5A75"/><text x="552" y="158" text-anchor="middle" class="num">2</text><text x="582" y="156" class="label">영향받는 사람</text><text x="548" y="198" class="note">편익과 비용은 누구에게 가는가</text><rect x="70" y="278" width="330" height="112" rx="14" fill="#FCFAF5" stroke="#1F5A75" stroke-width="2"/><circle cx="102" cy="312" r="17" fill="#1F5A75"/><text x="102" y="318" text-anchor="middle" class="num">3</text><text x="132" y="316" class="label">측정 지표</text><text x="98" y="358" class="note">무엇으로 결과를 확인할 것인가</text><rect x="520" y="278" width="330" height="112" rx="14" fill="#FCFAF5" stroke="#A94E32" stroke-width="2"/><circle cx="552" cy="312" r="17" fill="#A94E32"/><text x="552" y="318" text-anchor="middle" class="num">4</text><text x="582" y="316" class="label">중단·수정 조건</text><text x="548" y="358" class="note">언제 판단을 바꿀 것인가</text></svg>