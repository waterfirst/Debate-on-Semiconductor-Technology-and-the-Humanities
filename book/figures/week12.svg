<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">UCIe 표준의 데이터율 선택지</title>
  <desc id="desc">UCIe 2.0의 최고 32 GT/s와 UCIe 3.0의 48 GT/s 및 64 GT/s 선택지를 비교한 막대그래프</desc>
  <style>
    .bg{fill:#F7F4ED}.title{font:700 25px "Noto Sans KR",sans-serif;fill:#10283F}
    .unit{font:20px "Noto Sans KR",sans-serif;fill:#6A625A}.label{font:20px "Noto Sans KR",sans-serif;fill:#253443}
    .value{font:700 20px "Noto Sans KR",sans-serif;fill:#10283F}.axis{stroke:#768594;stroke-width:1.4}
    .grid{stroke:#D9D1C5;stroke-width:1}.note{font:20px "Noto Sans KR",sans-serif;fill:#756C63}
  </style>
  <rect class="bg" width="100%" height="100%" rx="18"/>
  <text x="30" y="44" class="title">UCIe 표준의 데이터율 선택지</text>
  <text x="30" y="72" class="unit">단위: GT/s(초당 기가 전송), 규격상 데이터율</text>
  <line x1="78" y1="350" x2="850" y2="350" class="axis"/>
  <line x1="78" y1="240" x2="850" y2="240" class="grid"/>
  <line x1="78" y1="130" x2="850" y2="130" class="grid"/>
  <rect x="157" y="240" width="112" height="110" rx="7" fill="#A94E32"/>
  <text x="213" y="226" text-anchor="middle" class="value">32</text>
  <text x="213" y="380" text-anchor="middle" class="label">UCIe 2.0 최고</text>
  <rect x="404" y="185" width="112" height="165" rx="7" fill="#1F5A75"/>
  <text x="460" y="171" text-anchor="middle" class="value">48</text>
  <text x="460" y="380" text-anchor="middle" class="label">UCIe 3.0 선택</text>
  <rect x="651" y="130" width="112" height="220" rx="7" fill="#4D7C6F"/>
  <text x="707" y="116" text-anchor="middle" class="value">64</text>
  <text x="707" y="380" text-anchor="middle" class="label">UCIe 3.0 최고</text>
  <text x="78" y="414" class="note">GT/s는 유효 GB/s가 아니며 레인 수·오버헤드·패키지 조건이 추가로 필요합니다.</text>
  <rect x="790" y="28" width="100" height="28" rx="14" fill="#10283F"/>
  <text x="840" y="47" text-anchor="middle" style="font:700 20px 'Noto Sans KR',sans-serif;fill:#F7F4ED">규격 비교</text>
</svg>
