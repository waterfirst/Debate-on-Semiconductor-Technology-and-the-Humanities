<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">목표를 못 채운 프로젝트를 계속할 것인가</title>
<style>
  .bg{fill:#F7F4ED} .title{font:700 25px "Noto Sans KR",sans-serif;fill:#10283F}
  .unit{font:20px "Noto Sans KR",sans-serif;fill:#6A625A} .label{font:20px "Noto Sans KR",sans-serif;fill:#253443}
  .value{font:700 20px "Noto Sans KR",sans-serif;fill:#10283F} .grid{stroke:#D9D1C5;stroke-width:1}
  .axis{stroke:#768594;stroke-width:1.4} .note{font:20px "Noto Sans KR",sans-serif;fill:#756C63}
</style>
<rect class="bg" width="100%" height="100%" rx="18"/>
<text x="30" y="44" class="title">목표를 못 채운 프로젝트를 계속할 것인가</text>
<text x="30" y="72" class="unit">단위: EU 세계 반도체 점유율(%)</text><desc id="desc">격차를 강조하는 롤리팝 차트</desc><text x="32" y="135" class="label">현재 약</text><line x1="275" y1="130" x2="547.5" y2="130" stroke="#A94E32" stroke-width="5" stroke-linecap="round"/><circle cx="547.5" cy="130" r="11" fill="#A94E32"/><text x="569.5" y="136" class="value">10</text><text x="32" y="205" class="label">2030 목표</text><line x1="275" y1="200" x2="820.0" y2="200" stroke="#1F5A75" stroke-width="5" stroke-linecap="round"/><circle cx="820.0" cy="200" r="11" fill="#1F5A75"/><text x="842.0" y="206" class="value">20</text><text x="32" y="410" class="note">최대값은 최소값의 2.0배 · 격차의 원인과 기준을 토론</text>
<rect x="792" y="28" width="98" height="28" rx="14" fill="#10283F"/><text x="841" y="47" text-anchor="middle" style="font:700 20px 'Noto Sans KR',sans-serif;fill:#F7F4ED">격차 비교</text>
</svg>